<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="John Leo Jariel" />
  <meta
   name="description"
   content="my 3rd js project which is countdown timer for date and time"
  />
  <link rel="stylesheet" href="styles.css" />
  <title>Countdown Timer</title>
 </head>
 <body>
  <main>
   <fieldset>
    <div class="header">
     <h1>Countdown Timer</h1>
    </div>

    <form id="userForm">
     <!-- Countdown Title -->
     <div class="input-field countdown-title">
      <label for="title-input">Countdown Title:</label>
      <input
       type="text"
       id="title-input"
       class="dropdown-input"
       name="countdown-title"
       placeholder="e.g, Birthday, New Year, Christmas..."
       required
      />
      <ul class="suggestion-list full-width">
       <li>Birthday</li>
       <li>New Year</li>
       <li>Christmas</li>
       <li>Vacation</li>
       <li>Wedding</li>
      </ul>
     </div>

     <!-- Date and Time -->
     <div class="fields">
      <!-- Day -->
      <div class="input-field column">
       <label for="day-input">Day:</label>
       <input
        type="text"
        id="day-input"
        name="day"
        class="dropdown-input"
        placeholder="dd"
       />
       <div class="suggestion-list">
        <table>
         <tbody>
          <tr id="days-row"></tr>
         </tbody>
        </table>
       </div>
      </div>
      <!-- Month -->
      <div class="input-field column">
       <label for="month-input">Month:</label>
       <input
        type="text"
        id="month-input"
        name="month"
        class="dropdown-input"
        placeholder="mm"
       />
       <div class="suggestion-list months full-width">
        <ul>
         <li>01 - Jan</li>
         <li>02 - Feb</li>
         <li>03 - Mar</li>
         <li>04 - Apr</li>
         <li>05 - May</li>
         <li>06 - Jun</li>
         <li>07 - Jul</li>
         <li>08 - Aug</li>
         <li>09 - Sept</li>
         <li>10 - Oct</li>
         <li>11 - Nov</li>
         <li>12 - Dec</li>
        </ul>
       </div>
      </div>
      <!-- Year -->
      <div class="input-field column">
       <label for="year-input">Year:</label>
       <input
        type="text"
        class="dropdown-input"
        name="year"
        id="year-input"
        placeholder="yyyy"
       />
       <ul class="suggestion-list years-list full-width"></ul>
      </div>
     </div>

     <div class="fields">
      <!-- Hour -->
      <div class="input-field column">
       <label for="hour-input">Hour:</label>
       <input
        type="text"
        id="hour-input"
        name="hour"
        class="dropdown-input"
        placeholder="hh"
       />
       <div class="suggestion-list">
        <table>
         <tbody>
          <tr id="hour-list"></tr>
         </tbody>
        </table>
       </div>
      </div>
      <!-- Minute -->
      <div class="input-field column">
       <label for="minute-input">Minute:</label>
       <input
        type="text"
        id="minute-input"
        name="minute"
        class="dropdown-input"
        placeholder="mm"
       />
       <div class="suggestion-list">
        <table>
         <tbody>
          <tr class="mmAndSs-list"></tr>
         </tbody>
        </table>
       </div>
      </div>
      <!-- Seconds -->
      <div class="input-field column">
       <label for="second-input">Second:</label>
       <input
        type="text"
        class="dropdown-input"
        name="second"
        id="second-input"
        placeholder="ss"
       />
       <div class="suggestion-list">
        <table>
         <tbody>
          <tr class="mmAndSs-list"></tr>
         </tbody>
        </table>
       </div>
      </div>
     </div>

     <!-- Location -->
     <div class="input-field event-location">
      <label for="location-input">Location of Event:</label>
      <input type="text" name="location" class="location-input" required />
     </div>

     <button type="submit" class="create-btn">Create Countdown</button>
    </form>
   </fieldset>
  </main>

  <script src="countdown-timer.js"></script>
 </body>
</html>
