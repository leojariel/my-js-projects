<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="John Leo Jariel" />
  <meta
   name="description"
   content="my 3rd js project which is countdown timer for date and time"
  />
  <link rel="stylesheet" href="styles.css" />
  <title>Countdown Timer</title>
 </head>
 <body>
  <main>
   <fieldset>
    <div class="header">
     <h1>Countdown Timer</h1>
    </div>

    <form>
     <!-- Countdown Title -->
     <div class="input-field countdown-title">
      <label for="title-input">Countdown Title:</label>
      <input
       type="text"
       id="title-input"
       class="dropdown-input"
       placeholder="e.g, Birthday, New Year, Christmas..."
       required
      />
      <ul class="suggestion-list">
       <li>Birthday</li>
       <li>New Year</li>
       <li>Christmas</li>
       <li>Vacation</li>
       <li>Wedding</li>
      </ul>
     </div>

     <!-- Date and Time -->
     <div class="fields">
      <!-- Day -->
      <div class="input-field column">
       <label for="day-input">Day:</label>
       <input type="text" id="day-input" placeholder="dd" />
      </div>
      <!-- Month -->
      <div class="input-field column">
       <label for="month-input">Month:</label>
       <input type="text" id="month-input" placeholder="mm" />
      </div>
      <!-- Year -->
      <div class="input-field column">
       <label for="year-input">Year:</label>
       <input type="text" id="year-input" placeholder="yyyy" />
      </div>
     </div>

     <div class="fields">
      <!-- Day -->
      <div class="input-field column">
       <label for="hour-input">Hour:</label>
       <input type="text" id="hour-input" placeholder="hh" />
      </div>
      <!-- Month -->
      <div class="input-field column">
       <label for="minute-input">Minute:</label>
       <input type="text" id="minute-input" placeholder="mm" />
      </div>
      <!-- Year -->
      <div class="input-field column">
       <label for="second-input">Second:</label>
       <input type="text" id="second-input" placeholder="ss" />
      </div>
     </div>

     <!-- Location -->
     <div class="input-field event-location">
      <label for="location-input">Location of Event:</label>
      <input type="text" form="location-input" required />
     </div>

     <button type="submit" class="create-btn">Create Countdown</button>
    </form>
   </fieldset>
  </main>

  <script src="countdown-timer.js"></script>
 </body>
</html>
